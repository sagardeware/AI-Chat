<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 SDK Test - Workaround for .cjs MIME Type</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            font-size: 3em;
            margin-bottom: 10px;
            text-align: center;
        }

        .status {
            text-align: center;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            font-size: 1.2em;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 SDK Loading Test</h1>
        <div id="status" class="status loading">⏳ Loading SDK...</div>
        <div id="details"></div>
    </div>

    <!-- SDK Configuration -->
    <script>
        window.VetChatbotConfig = {
            apiUrl: 'https://ai-chat-backend-5mfu.onrender.com',
            userId: 'test-user-' + Date.now(),
            userName: 'Test User',
            source: 'cjs-workaround-test'
        };
    </script>

    <!-- Load SDK using fetch workaround for .cjs MIME type issue -->
    <script>
        const statusEl = document.getElementById('status');
        const detailsEl = document.getElementById('details');

        async function loadSDK() {
            try {
                statusEl.textContent = '⏳ Fetching SDK from Render...';
                statusEl.className = 'status loading';

                // Fetch the SDK file
                const response = await fetch('https://ai-chat-frontend-pm8e.onrender.com/sdk/vet-chatbot-sdk.umd.cjs');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                statusEl.textContent = '⏳ Loading SDK code...';

                // Get the JavaScript code as text
                const sdkCode = await response.text();

                statusEl.textContent = '⏳ Executing SDK...';

                // Execute the SDK code
                eval(sdkCode);

                // Wait a moment for SDK to initialize
                await new Promise(resolve => setTimeout(resolve, 1000));

                // Check if SDK loaded
                if (window.VetChatbot) {
                    statusEl.textContent = '✅ SDK Loaded Successfully!';
                    statusEl.className = 'status success';
                    detailsEl.innerHTML = `
                        <div style="margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 10px;">
                            <h3>SDK Status:</h3>
                            <p>✅ SDK initialized</p>
                            <p>✅ API methods available: ${Object.keys(window.VetChatbot).join(', ')}</p>
                            <p>✅ Backend: ${window.VetChatbotConfig.apiUrl}</p>
                            <p style="margin-top: 15px; color: #667eea; font-weight: bold;">
                                👉 Look for the chat widget in the bottom-right corner!
                            </p>
                        </div>
                    `;
                } else {
                    throw new Error('SDK did not initialize properly');
                }

            } catch (error) {
                statusEl.textContent = '❌ Failed to load SDK';
                statusEl.className = 'status error';
                detailsEl.innerHTML = `
                    <div style="margin-top: 20px; padding: 20px; background: #f8d7da; border-radius: 10px;">
                        <h3>Error Details:</h3>
                        <p>${error.message}</p>
                        <pre style="margin-top: 10px; padding: 10px; background: white; border-radius: 5px; overflow-x: auto;">${error.stack}</pre>
                    </div>
                `;
                console.error('SDK Loading Error:', error);
            }
        }

        // Load SDK when page loads
        loadSDK();
    </script>
</body>

</html>
